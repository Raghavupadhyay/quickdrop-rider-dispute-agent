name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Unit tests (no LLM, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  evals:
    name: docker compose up + evals (rule-based reader, no API key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8081/health
      - name: Run the evals
        # Each conversation is meant for a fresh system; R003 appears twice,
        # so one STALE result is expected here and does not fail the job.
        run: python evals/run.py http://localhost:8000 --json eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.json
      - name: Logs on failure
        if: failure()
        run: docker compose logs app --tail 200
